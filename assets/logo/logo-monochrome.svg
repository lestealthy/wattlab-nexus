<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <!-- WattLab Nexus Logo - Monochrome -->
  <g fill="#000000">
    <!-- Circuit trace motif -->
    <g stroke="#000000" stroke-width="1" fill="none" opacity="0.3">
      <path d="M20 20 L60 20 L80 40 L120 40"/>
      <path d="M20 100 L60 100 L80 80 L120 80"/>
      <circle cx="20" cy="20" r="3" fill="#000000"/>
      <circle cx="20" cy="100" r="3" fill="#000000"/>
      <circle cx="120" cy="40" r="3" fill="#000000"/>
      <circle cx="120" cy="80" r="3" fill="#000000"/>
    </g>

    <!-- Nexus node network -->
    <g stroke="#000000" stroke-width="2" fill="none">
      <path d="M140 30 L180 60 L140 90" opacity="0.6"/>
      <path d="M180 60 L220 30" opacity="0.6"/>
      <path d="M180 60 L220 90" opacity="0.6"/>
    </g>
    <g fill="#000000">
      <circle cx="140" cy="30" r="4"/>
      <circle cx="180" cy="60" r="5"/>
      <circle cx="140" cy="90" r="4"/>
      <circle cx="220" cy="30" r="4"/>
      <circle cx="220" cy="90" r="4"/>
    </g>

    <!-- Waveform motif -->
    <polyline points="240,60 250,40 260,80 270,40 280,80 290,60"
      fill="none" stroke="#000000" stroke-width="2" opacity="0.8"/>

    <!-- Brand text -->
    <text x="300" y="55" font-family="Arial, sans-serif" font-size="24"
      font-weight="bold" fill="#000000" text-anchor="middle">WATTLAB</text>
    <text x="300" y="80" font-family="Arial, sans-serif" font-size="16"
      fill="#000000" text-anchor="middle" letter-spacing="4">NEXUS</text>

    <!-- Subtitle -->
    <text x="200" y="110" font-family="Arial, sans-serif" font-size="8"
      fill="#000000" text-anchor="middle" letter-spacing="2">UNIVERSAL EMBEDDED ENGINEERING WORKSTATION</text>
  </g>
</svg>
