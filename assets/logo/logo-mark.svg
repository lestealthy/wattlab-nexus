<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- WattLab Nexus Logo Mark -->
  <defs>
    <linearGradient id="markGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B4FF"/>
      <stop offset="100%" style="stop-color:#0080CC"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#0A1628" stroke="#1E3A5F" stroke-width="2"/>

  <!-- Nexus node network -->
  <g stroke="url(#markGradient)" stroke-width="2" fill="none">
    <path d="M16 16 L32 32 L16 48" opacity="0.8"/>
    <path d="M32 32 L48 16" opacity="0.8"/>
    <path d="M32 32 L48 48" opacity="0.8"/>
  </g>
  <g fill="#00B4FF">
    <circle cx="16" cy="16" r="3"/>
    <circle cx="32" cy="32" r="4"/>
    <circle cx="16" cy="48" r="3"/>
    <circle cx="48" cy="16" r="3"/>
    <circle cx="48" cy="48" r="3"/>
  </g>

  <!-- Waveform accent -->
  <polyline points="20,32 24,26 28,38 32,26 36,38 40,32"
    fill="none" stroke="#00B4FF" stroke-width="1.5" opacity="0.6"/>
</svg>
